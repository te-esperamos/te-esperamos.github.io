<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conexión con Mercado Libre</title>
<!--
  Página de retorno de la autorización de Mercado Libre (OAuth 2.0 con PKCE).
  Mercado Libre exige una dirección fija registrada en la app; esta página estática solo MUESTRA la dirección con el
  código para que el dueño la copie en su terminal. No carga nada de terceros, no guarda nada y no
  manda nada a ningún lado: el código no sirve sin el secreto de la app ni el verificador PKCE, que nunca salen de su PC.
-->
<style>
  :root { --green:#3F6B5C; --gold:#B8955A; --cream:#FBF8F3; --ink:#2B2A28; --muted:#8A837A; --line:#E6DFD3; --red:#B3412F; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.5 'Segoe UI', Arial, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 20px; }
  h1 { font:700 28px/1.2 Georgia, serif; color:var(--green); margin:0 0 8px; }
  p { margin:10px 0; }
  .box { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; word-break:break-all;
         font:13px/1.45 Consolas, monospace; margin:16px 0; }
  button { background:var(--green); color:#fff; border:0; border-radius:8px; padding:12px 18px; font:600 15px 'Segoe UI', Arial; cursor:pointer; }
  .ok { color:var(--green); font-weight:600; margin-left:10px; }
  .err { color:var(--red); font-weight:600; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Conexión con Mercado Libre</h1>
  <p id="msg">Copiá la dirección completa de abajo y pegala en la terminal donde corriste <code>python -m factory.ml_api auth</code>.</p>
  <div class="box" id="url"></div>
  <button id="copy" type="button">Copiar dirección</button><span class="ok" id="done" hidden>✓ Copiada</span>
  <p><small>Esta página no guarda ni envía nada. Si no pediste conectar tu cuenta, cerrala.</small></p>
</main>
<script>
  const url = location.href;
  const q = new URLSearchParams(location.search);
  document.getElementById("url").textContent = url;
  if (q.get("error")) {
    const m = document.getElementById("msg");
    m.className = "err";
    m.textContent = "Mercado Libre devolvió un error: " + q.get("error") + (q.get("error_description") ? " — " + q.get("error_description") : "");
  }
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(url); } catch (e) {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("url"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy");
    }
    document.getElementById("done").hidden = false;
  });
</script>
</body>
</html>
